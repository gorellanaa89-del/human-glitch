name: Expressive voice audition

# Tries more expressive voice engines than edge-tts on the audition text:
# Chatterbox Multilingual (open source, CPU) and, if the GEMINI_API_KEY secret exists, Gemini TTS.
on:
  push:
    paths: ["tools/audition/expressive/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audition:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get install -y -q ffmpeg >/dev/null
      - name: Gemini TTS
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python tools/audition/expressive/gemini_audition.py tools/audition/hook.es.txt out
      - name: Engines to try (tools/audition/expressive/engines.txt, default both)
        run: |
          E=$(cat tools/audition/expressive/engines.txt 2>/dev/null || echo "gemini chatterbox")
          echo "ENGINES=$E" >> "$GITHUB_ENV"
          echo "OUTBRANCH=previews-$(echo $E | tr ' ' '-')" >> "$GITHUB_ENV"
      - name: Install Chatterbox (CPU)
        if: contains(env.ENGINES, 'chatterbox')
        run: |
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q chatterbox-tts edge-tts==7.3.1
      - name: Synthetic timbre prompt (Emma, a Microsoft voice, not a real person)
        if: contains(env.ENGINES, 'chatterbox')
        run: |
          edge-tts --voice en-US-EmmaMultilingualNeural --rate=+10% --text "Y lo curioso es esto: casi nadie se da cuenta de que lo hace. Pero cuando lo ves una vez, ya no puedes dejar de verlo en todas partes." --write-media p.mp3
          ffmpeg -v error -y -i p.mp3 -ar 24000 -ac 1 prompt.wav
      - name: Chatterbox
        if: contains(env.ENGINES, 'chatterbox')
        run: python tools/audition/expressive/chatterbox_audition.py tools/audition/hook.es.txt out prompt.wav
      - name: Push clips
        if: always()
        run: |
          cd out || exit 0
          for f in *.wav; do ffmpeg -v error -y -i "$f" -b:a 96k "${f%.wav}.mp3" && rm "$f"; done
          git init -q -b "$OUTBRANCH"
          git config user.name "human-glitch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -qm "Expressive audition"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$OUTBRANCH"
