description: |
  Linda would rather wait two hours in line at the bank, or take two buses across the city, than open the banking app. Do you know someone like this? Meet The Anchor: the voice that grabs on to the way things are and won't let go. We follow Linda and her daughter Sarah, see why the familiar path kept our ancestors alive, and learn four ways to help a parent who resists every change.

  {chapters}

  Inside Voice Psychology: the stories behind the voice in your head.
