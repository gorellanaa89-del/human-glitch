  description: |
    Una jefa que dice siempre lo hemos hecho así, una mamá que no quiere usar la app del banco, un abuelo que no suelta las llaves del auto. ¿Conoces a alguien así? Conoce al Ancla: la voz que se aferra a cómo son las cosas y no las suelta. Seguimos a Margaret, a la mamá de Sarah y al abuelo de Daniel, entendemos por qué el camino conocido mantenía vivos a nuestros ancestros y aprendemos cuatro formas de ayudar a alguien que se resiste a todo cambio.

    {chapters}

    Inside Voice Psychology: las historias detrás de la voz en tu cabeza.
