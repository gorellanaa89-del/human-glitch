name: Channel stats

# Read-only: prints the channel's views, watch time and retention. Changes nothing on YouTube.
on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-1kd9a9]
    paths: [tools/channel_stats.py, .github/workflows/stats.yml]

jobs:
  stats:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: PYTHONPATH=. python tools/channel_stats.py
