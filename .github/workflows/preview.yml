name: Preview scenes

# Downloads stock footage for an episode and saves still frames. Makes no voice, no video, uploads nothing to YouTube.
on:
  workflow_dispatch:
    inputs:
      episode:
        description: Episode folder
        default: episodes/001-impostor-syndrome

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Restore cached ffmpeg packages
        run: echo "IMG=${ImageVersion:-none}" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v4
        with:
          path: ~/apt-debs
          key: apt-ffmpeg-${{ runner.os }}-${{ env.IMG }}-v1
      - name: Install ffmpeg and brand fonts
        timeout-minutes: 15
        run: bash tools/install-deps.sh
      - name: Save ffmpeg packages for the next runs
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ~/apt-debs
          key: apt-ffmpeg-${{ runner.os }}-${{ env.IMG }}-v1
      - run: pip install -r requirements.txt
      - name: Render preview frames
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python tools/preview_scenes.py "${{ inputs.episode }}" 2
      - uses: actions/upload-artifact@v4
        with:
          name: preview
          path: preview/
      - name: Save frames to the previews branch
        run: |
          cd preview
          git init -q -b previews
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -qm "Preview frames for ${{ inputs.episode }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" previews
