description: |
  The company has a new system, and Margaret answers the way she always does: we've done it this way for fifteen years. Do you know someone like this? Meet The Anchor: the voice that grabs on to the way things are and won't let go. We follow Margaret's story, see why the familiar path kept our ancestors alive, and learn four ways to help someone who resists every change.

  {chapters}

  Inside Voice Psychology: the stories behind the voice in your head.
