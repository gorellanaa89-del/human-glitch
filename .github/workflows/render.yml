name: Render episode (no upload)

# Builds one episode exactly like "Produce episodes" but never uploads to YouTube.
# The full files are kept as a run artifact; a light 720p preview, the Short, the thumbnail and
# a few frames are pushed to the `previews` branch so they can be reviewed without downloading.
on:
  workflow_dispatch:
    inputs:
      episode:
        description: "Episode folder, e.g. 001-impostor-syndrome"
        required: true
      seconds:
        description: "Only render the first N seconds (quick test). Empty = whole episode"
        required: false
        default: ""
      backgrounds:
        description: "Override the episode's backgrounds: drawn or photo. Empty = as in meta.yaml"
        required: false
        default: ""

env:
  HG_BACKGROUNDS: ${{ inputs.backgrounds }}

permissions:
  contents: write

concurrency:
  group: render-${{ inputs.episode }}
  cancel-in-progress: true

jobs:
  # List the scenes so each one can be drawn on its own machine at the same time.
  plan:
    runs-on: ubuntu-24.04
    outputs:
      scenes: ${{ steps.list.outputs.scenes }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          N=$(grep -c '^# Scene:' "episodes/${{ inputs.episode }}/script.en.md")
          echo "scenes=$(python3 -c "print(list(range(1, $N + 1)))")" >> "$GITHUB_OUTPUT"

  # One machine per scene: voice (EN + ES), the animated picture and, if the scene has a Short, its vertical picture.
  scene:
    needs: plan
    if: inputs.seconds == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        scene: ${{ fromJson(needs.plan.outputs.scenes) }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore cached ffmpeg packages
        run: echo "IMG=${ImageVersion:-none}" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v4
        with:
          path: ~/apt-debs
          key: apt-ffmpeg-${{ runner.os }}-${{ env.IMG }}-v1
      - name: Install ffmpeg and fonts
        timeout-minutes: 15
        run: |
          bash tools/install-deps.sh
      - name: Save ffmpeg packages for the next runs
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ~/apt-debs
          key: apt-ffmpeg-${{ runner.os }}-${{ env.IMG }}-v1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Render scene ${{ matrix.scene }}
        run: python -m hg build "episodes/${{ inputs.episode }}" --scene ${{ matrix.scene }}

      - uses: actions/upload-artifact@v4
        with:
          name: scene-${{ matrix.scene }}
          path: episodes/${{ inputs.episode }}/output/work/
          retention-days: 1

  # Join the scenes, mix the audio, cut the Shorts, push the previews.
  render:
    needs: [plan, scene]
    if: always() && needs.plan.result == 'success' && (needs.scene.result == 'success' || needs.scene.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Restore cached ffmpeg packages
        run: echo "IMG=${ImageVersion:-none}" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v4
        with:
          path: ~/apt-debs
          key: apt-ffmpeg-${{ runner.os }}-${{ env.IMG }}-v1
      - name: Install ffmpeg and fonts
        timeout-minutes: 15
        run: |
          bash tools/install-deps.sh
      - name: Save ffmpeg packages for the next runs
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ~/apt-debs
          key: apt-ffmpeg-${{ runner.os }}-${{ env.IMG }}-v1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collect the rendered scenes
        if: inputs.seconds == ''
        uses: actions/download-artifact@v4
        with:
          pattern: scene-*
          merge-multiple: true
          path: episodes/${{ inputs.episode }}/output/work/

      - name: Render
        run: |
          if [ -n "${{ inputs.seconds }}" ]; then
            python -m hg build "episodes/${{ inputs.episode }}" --max-seconds "${{ inputs.seconds }}"
          else
            python -m hg build "episodes/${{ inputs.episode }}"
          fi

      - name: Keep the full files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-${{ inputs.episode }}
          path: |
            episodes/${{ inputs.episode }}/output/*
            !episodes/${{ inputs.episode }}/output/work
          retention-days: 14
          if-no-files-found: ignore

      - name: Push a light preview to the previews branch
        run: |
          OUT="episodes/${{ inputs.episode }}/output"
          P=$(mktemp -d)
          ffmpeg -loglevel error -y -i "$OUT/video.mp4" -vf scale=-2:720 -c:v libx264 -preset veryfast -crf 30 \
            -c:a aac -b:a 96k -movflags +faststart "$P/preview-720p.mp4"
          if [ $(stat -c%s "$P/preview-720p.mp4") -gt 95000000 ]; then
            ffmpeg -loglevel error -y -i "$OUT/video.mp4" -vf scale=-2:540 -c:v libx264 -preset veryfast -crf 32 \
              -c:a aac -b:a 64k -movflags +faststart "$P/preview-720p.mp4"
          fi
          if [ -f "$OUT/audio.es.m4a" ]; then
            # same picture, Spanish voice: what a viewer gets when picking the Spanish track on YouTube
            ffmpeg -loglevel error -y -i "$P/preview-720p.mp4" -i "$OUT/audio.es.m4a" -map 0:v -map 1:a \
              -c:v copy -c:a aac -b:a 96k -shortest -movflags +faststart "$P/preview-es-720p.mp4"
          fi
          cp "$OUT"/short*.mp4 "$OUT"/captions.*.srt "$OUT/thumbnail.jpg" "$OUT/report.json" "$OUT/description.txt" "$P/" 2>/dev/null || true
          mkdir -p "$P/frames"
          D=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$OUT/video.mp4")
          for k in $(seq 1 24); do
            T=$(python3 -c "print(round($D*$k/25,2))")
            ffmpeg -loglevel error -y -ss "$T" -i "$OUT/video.mp4" -frames:v 1 -vf scale=960:-2 "$P/frames/$(printf %02d $k).jpg"
          done
          cd "$P"
          git init -q -b previews
          git config user.name "human-glitch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -qm "Preview of ${{ inputs.episode }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" previews
