name: Produce episodes

# Runs when an episode's meta.yaml changes (for example approved: false -> true),
# or by hand from the Actions tab.
on:
  push:
    branches: [main]
    paths: ["episodes/**/meta.yaml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: produce
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg and brand fonts
        timeout-minutes: 25
        run: bash tools/install-deps.sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Render and upload approved episodes
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python -m hg run-approved

      - name: Keep the finished files for download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: episodes-output
          path: |
            episodes/*/output/*
            !episodes/*/output/work
          retention-days: 14
          if-no-files-found: ignore

      - name: Record what was uploaded
        if: success()
        run: |
          git config user.name "human-glitch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add episodes/*/uploaded.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Record uploaded episodes" && git push)
