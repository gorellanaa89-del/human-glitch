    Linda prefiere hacer dos horas de cola en el banco, o tomar dos buses al otro lado de la ciudad, antes que abrir la app. ¿Conoces a alguien así? Conoce al Ancla: la voz que se aferra a cómo son las cosas y no las suelta. Seguimos a Linda y a su hija Sarah, entendemos por qué el camino conocido mantenía vivos a nuestros ancestros y aprendemos cuatro formas de ayudar a un papá o una mamá que se resiste a todo cambio.

