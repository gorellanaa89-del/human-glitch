description: |
  A boss who says we've always done it this way, a mom who won't touch the banking app, a grandfather who won't give up the car keys. Do you know someone like this? Meet The Anchor: the voice that grabs on to the way things are and won't let go. We follow Margaret, Sarah's mom and Daniel's grandfather, see why the familiar path kept our ancestors alive, and learn four ways to help someone who resists every change.

  {chapters}

  Inside Voice Psychology: the stories behind the voice in your head.
