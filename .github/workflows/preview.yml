name: Preview scenes

# Downloads stock footage for an episode and saves still frames. Makes no voice, no video, uploads nothing to YouTube.
on:
  workflow_dispatch:
    inputs:
      episode:
        description: Episode folder
        default: episodes/001-impostor-syndrome

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ffmpeg and brand fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          sudo apt-get install -y fonts-inter fonts-jetbrains-mono || true
      - run: pip install -r requirements.txt
      - name: Render preview frames
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python tools/preview_scenes.py "${{ inputs.episode }}" 2
      - uses: actions/upload-artifact@v4
        with:
          name: preview
          path: preview/
