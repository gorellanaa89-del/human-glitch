name: Render episode (no upload)

# Builds one episode exactly like "Produce episodes" but never uploads to YouTube.
# The full files are kept as a run artifact; a light 720p preview, the Short, the thumbnail and
# a few frames are pushed to the `previews` branch so they can be reviewed without downloading.
on:
  workflow_dispatch:
    inputs:
      episode:
        description: "Episode folder, e.g. 001-impostor-syndrome"
        required: true
      seconds:
        description: "Only render the first N seconds (quick test). Empty = whole episode"
        required: false
        default: ""
      backgrounds:
        description: "Override the episode's backgrounds: drawn or photo. Empty = as in meta.yaml"
        required: false
        default: ""
      branch:
        description: "Branch the light preview is pushed to (use one per episode to render several at once)"
        required: false
        default: "previews"

env:
  HG_BACKGROUNDS: ${{ inputs.backgrounds }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

permissions:
  contents: write

concurrency:
  group: render-${{ inputs.episode }}
  cancel-in-progress: true

jobs:
  # List the scenes so each one can be drawn on its own machine at the same time.
  plan:
    runs-on: ubuntu-24.04
    outputs:
      scenes: ${{ steps.list.outputs.scenes }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          N=$(grep -c '^# Scene:' "episodes/${{ inputs.episode }}/script.en.md")
          echo "scenes=$(python3 -c "print(list(range(1, $N + 1)))")" >> "$GITHUB_OUTPUT"

  # One machine per scene: voice (EN + ES), the animated picture and, if the scene has a Short, its vertical picture.
  scene:
    needs: plan
    if: inputs.seconds == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        scene: ${{ fromJson(needs.plan.outputs.scenes) }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore cached ffmpeg packages
        run: echo "IMG=${ImageVersion:-none}" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v4
        with:
          path: ~/apt-debs
          key: apt-ffmpeg-${{ runner.os }}-${{ env.IMG }}-v1
      - name: Install ffmpeg and fonts
        timeout-minutes: 15
        run: |
          bash tools/install-deps.sh
      - name: Save ffmpeg packages for the next runs
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ~/apt-debs
          key: apt-ffmpeg-${{ runner.os }}-${{ env.IMG }}-v1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Render scene ${{ matrix.scene }}
        run: python -m hg build "episodes/${{ inputs.episode }}" --scene ${{ matrix.scene }}

      # Scenes travel to the joining job through the Actions cache (artifact storage is full on the free plan).
      - uses: actions/cache/save@v4
        with:
          path: episodes/${{ inputs.episode }}/output/work/
          key: scene-${{ inputs.episode }}-${{ github.run_id }}-${{ matrix.scene }}

  # Join the scenes, mix the audio, cut the Shorts, push the previews.
  render:
    needs: [plan, scene]
    if: always() && needs.plan.result == 'success' && (needs.scene.result == 'success' || needs.scene.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Restore cached ffmpeg packages
        run: echo "IMG=${ImageVersion:-none}" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v4
        with:
          path: ~/apt-debs
          key: apt-ffmpeg-${{ runner.os }}-${{ env.IMG }}-v1
      - name: Install ffmpeg and fonts
        timeout-minutes: 15
        run: |
          bash tools/install-deps.sh
      - name: Save ffmpeg packages for the next runs
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ~/apt-debs
          key: apt-ffmpeg-${{ runner.os }}-${{ env.IMG }}-v1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collect scene 1
        if: inputs.seconds == '' && contains(needs.plan.outputs.scenes, ' 1,') || inputs.seconds == '' && endsWith(needs.plan.outputs.scenes, ' 1]') || inputs.seconds == '' && startsWith(needs.plan.outputs.scenes, '[1,')
        uses: actions/cache/restore@v4
        with:
          path: episodes/${{ inputs.episode }}/output/work/
          key: scene-${{ inputs.episode }}-${{ github.run_id }}-1
          fail-on-cache-miss: true
      - name: Collect scene 2
        if: inputs.seconds == '' && contains(needs.plan.outputs.scenes, ' 2,') || inputs.seconds == '' && endsWith(needs.plan.outputs.scenes, ' 2]') || inputs.seconds == '' && startsWith(needs.plan.outputs.scenes, '[2,')
        uses: actions/cache/restore@v4
        with:
          path: episodes/${{ inputs.episode }}/output/work/
          key: scene-${{ inputs.episode }}-${{ github.run_id }}-2
          fail-on-cache-miss: true
      - name: Collect scene 3
        if: inputs.seconds == '' && contains(needs.plan.outputs.scenes, ' 3,') || inputs.seconds == '' && endsWith(needs.plan.outputs.scenes, ' 3]') || inputs.seconds == '' && startsWith(needs.plan.outputs.scenes, '[3,')
        uses: actions/cache/restore@v4
        with:
          path: episodes/${{ inputs.episode }}/output/work/
          key: scene-${{ inputs.episode }}-${{ github.run_id }}-3
          fail-on-cache-miss: true
      - name: Collect scene 4
        if: inputs.seconds == '' && contains(needs.plan.outputs.scenes, ' 4,') || inputs.seconds == '' && endsWith(needs.plan.outputs.scenes, ' 4]') || inputs.seconds == '' && startsWith(needs.plan.outputs.scenes, '[4,')
        uses: actions/cache/restore@v4
        with:
          path: episodes/${{ inputs.episode }}/output/work/
          key: scene-${{ inputs.episode }}-${{ github.run_id }}-4
          fail-on-cache-miss: true
      - name: Collect scene 5
        if: inputs.seconds == '' && contains(needs.plan.outputs.scenes, ' 5,') || inputs.seconds == '' && endsWith(needs.plan.outputs.scenes, ' 5]') || inputs.seconds == '' && startsWith(needs.plan.outputs.scenes, '[5,')
        uses: actions/cache/restore@v4
        with:
          path: episodes/${{ inputs.episode }}/output/work/
          key: scene-${{ inputs.episode }}-${{ github.run_id }}-5
          fail-on-cache-miss: true
      - name: Collect scene 6
        if: inputs.seconds == '' && contains(needs.plan.outputs.scenes, ' 6,') || inputs.seconds == '' && endsWith(needs.plan.outputs.scenes, ' 6]') || inputs.seconds == '' && startsWith(needs.plan.outputs.scenes, '[6,')
        uses: actions/cache/restore@v4
        with:
          path: episodes/${{ inputs.episode }}/output/work/
          key: scene-${{ inputs.episode }}-${{ github.run_id }}-6
          fail-on-cache-miss: true
      - name: Collect scene 7
        if: inputs.seconds == '' && contains(needs.plan.outputs.scenes, ' 7,') || inputs.seconds == '' && endsWith(needs.plan.outputs.scenes, ' 7]') || inputs.seconds == '' && startsWith(needs.plan.outputs.scenes, '[7,')
        uses: actions/cache/restore@v4
        with:
          path: episodes/${{ inputs.episode }}/output/work/
          key: scene-${{ inputs.episode }}-${{ github.run_id }}-7
          fail-on-cache-miss: true
      - name: Collect scene 8
        if: inputs.seconds == '' && contains(needs.plan.outputs.scenes, ' 8,') || inputs.seconds == '' && endsWith(needs.plan.outputs.scenes, ' 8]') || inputs.seconds == '' && startsWith(needs.plan.outputs.scenes, '[8,')
        uses: actions/cache/restore@v4
        with:
          path: episodes/${{ inputs.episode }}/output/work/
          key: scene-${{ inputs.episode }}-${{ github.run_id }}-8
          fail-on-cache-miss: true
      - name: Collect scene 9
        if: inputs.seconds == '' && contains(needs.plan.outputs.scenes, ' 9,') || inputs.seconds == '' && endsWith(needs.plan.outputs.scenes, ' 9]') || inputs.seconds == '' && startsWith(needs.plan.outputs.scenes, '[9,')
        uses: actions/cache/restore@v4
        with:
          path: episodes/${{ inputs.episode }}/output/work/
          key: scene-${{ inputs.episode }}-${{ github.run_id }}-9
          fail-on-cache-miss: true
      - name: Collect scene 10
        if: inputs.seconds == '' && contains(needs.plan.outputs.scenes, ' 10,') || inputs.seconds == '' && endsWith(needs.plan.outputs.scenes, ' 10]') || inputs.seconds == '' && startsWith(needs.plan.outputs.scenes, '[10,')
        uses: actions/cache/restore@v4
        with:
          path: episodes/${{ inputs.episode }}/output/work/
          key: scene-${{ inputs.episode }}-${{ github.run_id }}-10
          fail-on-cache-miss: true
      - name: Collect scene 11
        if: inputs.seconds == '' && contains(needs.plan.outputs.scenes, ' 11,') || inputs.seconds == '' && endsWith(needs.plan.outputs.scenes, ' 11]') || inputs.seconds == '' && startsWith(needs.plan.outputs.scenes, '[11,')
        uses: actions/cache/restore@v4
        with:
          path: episodes/${{ inputs.episode }}/output/work/
          key: scene-${{ inputs.episode }}-${{ github.run_id }}-11
          fail-on-cache-miss: true
      - name: Collect scene 12
        if: inputs.seconds == '' && contains(needs.plan.outputs.scenes, ' 12,') || inputs.seconds == '' && endsWith(needs.plan.outputs.scenes, ' 12]') || inputs.seconds == '' && startsWith(needs.plan.outputs.scenes, '[12,')
        uses: actions/cache/restore@v4
        with:
          path: episodes/${{ inputs.episode }}/output/work/
          key: scene-${{ inputs.episode }}-${{ github.run_id }}-12
          fail-on-cache-miss: true
      - name: Collect scene 13
        if: inputs.seconds == '' && contains(needs.plan.outputs.scenes, ' 13,') || inputs.seconds == '' && endsWith(needs.plan.outputs.scenes, ' 13]') || inputs.seconds == '' && startsWith(needs.plan.outputs.scenes, '[13,')
        uses: actions/cache/restore@v4
        with:
          path: episodes/${{ inputs.episode }}/output/work/
          key: scene-${{ inputs.episode }}-${{ github.run_id }}-13
          fail-on-cache-miss: true
      - name: Collect scene 14
        if: inputs.seconds == '' && contains(needs.plan.outputs.scenes, ' 14,') || inputs.seconds == '' && endsWith(needs.plan.outputs.scenes, ' 14]') || inputs.seconds == '' && startsWith(needs.plan.outputs.scenes, '[14,')
        uses: actions/cache/restore@v4
        with:
          path: episodes/${{ inputs.episode }}/output/work/
          key: scene-${{ inputs.episode }}-${{ github.run_id }}-14
          fail-on-cache-miss: true
      - name: Collect scene 15
        if: inputs.seconds == '' && contains(needs.plan.outputs.scenes, ' 15,') || inputs.seconds == '' && endsWith(needs.plan.outputs.scenes, ' 15]') || inputs.seconds == '' && startsWith(needs.plan.outputs.scenes, '[15,')
        uses: actions/cache/restore@v4
        with:
          path: episodes/${{ inputs.episode }}/output/work/
          key: scene-${{ inputs.episode }}-${{ github.run_id }}-15
          fail-on-cache-miss: true
      - name: Collect scene 16
        if: inputs.seconds == '' && contains(needs.plan.outputs.scenes, ' 16,') || inputs.seconds == '' && endsWith(needs.plan.outputs.scenes, ' 16]') || inputs.seconds == '' && startsWith(needs.plan.outputs.scenes, '[16,')
        uses: actions/cache/restore@v4
        with:
          path: episodes/${{ inputs.episode }}/output/work/
          key: scene-${{ inputs.episode }}-${{ github.run_id }}-16
          fail-on-cache-miss: true
      - name: Collect scene 17
        if: inputs.seconds == '' && contains(needs.plan.outputs.scenes, ' 17,') || inputs.seconds == '' && endsWith(needs.plan.outputs.scenes, ' 17]') || inputs.seconds == '' && startsWith(needs.plan.outputs.scenes, '[17,')
        uses: actions/cache/restore@v4
        with:
          path: episodes/${{ inputs.episode }}/output/work/
          key: scene-${{ inputs.episode }}-${{ github.run_id }}-17
          fail-on-cache-miss: true
      - name: Collect scene 18
        if: inputs.seconds == '' && contains(needs.plan.outputs.scenes, ' 18,') || inputs.seconds == '' && endsWith(needs.plan.outputs.scenes, ' 18]') || inputs.seconds == '' && startsWith(needs.plan.outputs.scenes, '[18,')
        uses: actions/cache/restore@v4
        with:
          path: episodes/${{ inputs.episode }}/output/work/
          key: scene-${{ inputs.episode }}-${{ github.run_id }}-18
          fail-on-cache-miss: true
      - name: Collect scene 19
        if: inputs.seconds == '' && contains(needs.plan.outputs.scenes, ' 19,') || inputs.seconds == '' && endsWith(needs.plan.outputs.scenes, ' 19]') || inputs.seconds == '' && startsWith(needs.plan.outputs.scenes, '[19,')
        uses: actions/cache/restore@v4
        with:
          path: episodes/${{ inputs.episode }}/output/work/
          key: scene-${{ inputs.episode }}-${{ github.run_id }}-19
          fail-on-cache-miss: true
      - name: Collect scene 20
        if: inputs.seconds == '' && contains(needs.plan.outputs.scenes, ' 20,') || inputs.seconds == '' && endsWith(needs.plan.outputs.scenes, ' 20]') || inputs.seconds == '' && startsWith(needs.plan.outputs.scenes, '[20,')
        uses: actions/cache/restore@v4
        with:
          path: episodes/${{ inputs.episode }}/output/work/
          key: scene-${{ inputs.episode }}-${{ github.run_id }}-20
          fail-on-cache-miss: true

      - name: Render
        run: |
          if [ -n "${{ inputs.seconds }}" ]; then
            python -m hg build "episodes/${{ inputs.episode }}" --max-seconds "${{ inputs.seconds }}"
          else
            python -m hg build "episodes/${{ inputs.episode }}"
          fi

      # The full files stay in the Actions cache (key render-<episode>-<run id>), where upload.yml picks them up.
      - name: Set the work files aside
        run: mv "episodes/${{ inputs.episode }}/output/work" "$RUNNER_TEMP/work" || true
      - name: Keep the full files
        uses: actions/cache/save@v4
        with:
          path: episodes/${{ inputs.episode }}/output/
          key: render-${{ inputs.episode }}-${{ github.run_id }}

      - name: Push a light preview to the previews branch
        run: |
          OUT="episodes/${{ inputs.episode }}/output"
          P=$(mktemp -d)
          ffmpeg -loglevel error -y -i "$OUT/video.mp4" -vf scale=-2:720 -c:v libx264 -preset veryfast -crf 30 \
            -c:a aac -b:a 96k -movflags +faststart "$P/preview-720p.mp4"
          if [ $(stat -c%s "$P/preview-720p.mp4") -gt 95000000 ]; then
            ffmpeg -loglevel error -y -i "$OUT/video.mp4" -vf scale=-2:540 -c:v libx264 -preset veryfast -crf 32 \
              -c:a aac -b:a 64k -movflags +faststart "$P/preview-720p.mp4"
          fi
          if [ -f "$OUT/video.es.mp4" ]; then
            # the Spanish picture (Spanish voice names, bubbles and cards)
            ffmpeg -loglevel error -y -i "$OUT/video.es.mp4" -vf scale=-2:720 -c:v libx264 -preset veryfast -crf 30 \
              -c:a aac -b:a 96k -movflags +faststart "$P/preview-es-720p.mp4"
          elif [ -f "$OUT/audio.es.m4a" ]; then
            # same picture, Spanish voice: what a viewer gets when picking the Spanish track on YouTube
            ffmpeg -loglevel error -y -i "$P/preview-720p.mp4" -i "$OUT/audio.es.m4a" -map 0:v -map 1:a \
              -c:v copy -c:a aac -b:a 96k -shortest -movflags +faststart "$P/preview-es-720p.mp4"
          fi
          cp "$OUT"/short*.mp4 "$OUT"/captions.*.srt "$OUT/thumbnail.jpg" "$OUT/report.json" "$OUT/description.txt" "$P/" 2>/dev/null || true
          mkdir -p "$P/frames"
          D=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$OUT/video.mp4")
          for k in $(seq 1 24); do
            T=$(python3 -c "print(round($D*$k/25,2))")
            ffmpeg -loglevel error -y -ss "$T" -i "$OUT/video.mp4" -frames:v 1 -vf scale=960:-2 "$P/frames/$(printf %02d $k).jpg"
          done
          cd "$P"
          git init -q -b "${{ inputs.branch }}"
          git config user.name "human-glitch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -qm "Preview of ${{ inputs.episode }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "${{ inputs.branch }}"
