  Sarah just got the promotion she worked three years for, so why does she feel like a fraud? Meet The Impostor: an old alarm in your brain that kept our ancestors in the group, and still goes off after good news. In this video we follow Sarah's story, see where the feeling comes from, and learn five simple ways to update it.

